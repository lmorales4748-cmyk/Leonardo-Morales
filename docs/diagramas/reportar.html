<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar un animal</title>
</head>
<body>

    <header>
        <h1>Reporte de animales en peligro</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="reportar.html">Reportar</a>
            <a href="rescates.html">Rescates</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulario de reporte</h2>

            <form>
                <label for="nombre">Nombre del reportante:</label>
                <input type="text" id="nombre" name="nombre" required>

                <br><br>

                <label for="especie">Tipo de animal:</label>
                <select id="especie" name="especie" required>
                    <option value="">Seleccione</option>
                    <option value="perro">Perro</option>
                    <option value="gato">Gato</option>
                    <option value="silvestre">Animal silvestre</option>
                </select>

                <br><br>

                <label for="ubicacion">Ubicación:</label>
                <input type="text" id="ubicacion" name="ubicacion" required>

                <br><br>

                <label for="urgencia">Nivel de urgencia:</label>
                <select id="urgencia" name="urgencia" required>
                    <option value="">Seleccione</option>
                    <option value="alta">Alta</option>
                    <option value="media">Media</option>
                    <option value="baja">Baja</option>
                </select>

                <br><br>

                <label for="descripcion">Descripción del caso:</label>
                <textarea id="descripcion" name="descripcion" rows="5" required></textarea>

                <br><br>

                <button type="submit">Enviar reporte</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Sistema de Control de Rescate y Adopción Animal</p>
    </footer>

</body>
</html>
